services:
  # The local subscription stack can use Chromium's own sandbox on Docker Desktop.
  agent-computer:
    image: openbot-agent-computer:sandbox-local
    pull_policy: never
    build:
      context: .
      dockerfile: agent-computer/Dockerfile.sandbox
    environment:
      COMPUTER_SANDBOX: "on"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./supervisor/chromium-seccomp.json
    shm_size: 1gb
  supervisor:
    pull_policy: never
    environment:
      COMPUTER_SANDBOX: "on"
      COMPUTER_IMAGE: openbot-agent-computer:sandbox-local
  agent-chatgpt:
    profiles: [chatgpt]
    image: openbot-agent-langgraph-agui:local
    build:
      context: .
      dockerfile: agent-langgraph-agui/Dockerfile
    environment:
      CHATGPT_AUTH_FILE: /auth/chatgpt-auth.json
      BOT_MODEL: ${CHATGPT_BOT_MODEL:-gpt-5.5}
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:?Start the local stack once to generate this token}
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN:?Start the local stack once to generate the callback token}
      OPENBOT_TOOL_URL: http://host.docker.internal:${SERVER_PORT:-3001}/api/agent-tools/call
    volumes:
      - ./.env.chatgpt:/auth
    ports:
      - "127.0.0.1:4206:4206"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4206/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  agent-claude-sdk:
    image: openbot-agent-claude-sdk:local
    build:
      context: .
      dockerfile: agent-claude-sdk/Dockerfile
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?Add your Claude subscription token to .env}
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:?Start the standard local stack once to generate this token}
    ports:
      - "127.0.0.1:4212:4212"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4212/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  agent-local:
    profiles: [local-model]
    image: openbot-agent-langgraph-agui:local
    environment:
      BOT_PROVIDER: openai
      BOT_MODEL: ${LOCAL_BOT_MODEL:-qwen3.5:latest}
      OPENBOT_LOCAL_MODEL: "true"
      OPENAI_BASE_URL: http://host.docker.internal:11434/v1
      OPENAI_API_KEY: ollama
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:?Start the local stack once to generate this token}
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN:?Start the local stack once to generate the callback token}
      OPENBOT_TOOL_URL: http://host.docker.internal:${SERVER_PORT:-3001}/api/agent-tools/call
    ports:
      - "127.0.0.1:4207:4206"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4206/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
